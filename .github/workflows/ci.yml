# Push/PR CI: run the offline test suite on every change.
# The release workflow (release.yml) stays manual-only and unchanged.
name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (blocking)
        run: cargo test --locked --all-features
      # AGENTS.md warning-free discipline, enforced at the compiler level
      # (RUSTFLAGS=-D warnings; a plain second build would replay nothing
      # from the cache).
      - name: zero-warnings gate (blocking)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --locked --all-features
      # Three python suites since the M7 true merge (the shared
      # services package, the rebuilt interface, the transitional tui
      # tree): 17 of 842 tests import the optional quantkit dependency,
      # which lives in a PRIVATE sibling repo (quant-core) that this
      # public runner cannot clone. Run the suites for visibility but do
      # not block on the quantkit-gated subset until quantkit is
      # published or a PAT is wired — the one-move flip plan for both
      # options lives in docs/ci-python-blocking.md, and
      # scripts/verify-python-ci-env.sh pre-flights it locally.
      - name: python tests (non-blocking until quantkit is reachable)
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-tui.txt numpy pandas pytest
          python -m pytest services/tests/ interface/tests/ tui/tests/ -q
